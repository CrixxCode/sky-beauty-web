name: sky-beauty

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sky_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sky_beauty}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-sky_beauty_test}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sky} -d ${POSTGRES_DB:-sky_beauty}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Los servicios backend y frontend se ejecutan en contenedores solo con el perfil "full":
  #   docker compose --profile full up --build
  # En el día a día se recomienda ejecutar cada proyecto en el host (npm run start:dev / npm run dev).
  backend:
    profiles: ['full']
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sky}:${POSTGRES_PASSWORD:-sky_dev_password}@postgres:5432/${POSTGRES_DB:-sky_beauty}?schema=public
      PORT: 4000
      NODE_ENV: production
      UPLOADS_DIR: /app/uploads
      TRUST_PROXY_HOPS: 1
    command: ['sh', '-c', 'npm run prisma:migrate:deploy && exec node dist/main.js']
    ports:
      - '4000:4000'
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ['full']
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        API_INTERNAL_URL: http://backend:4000
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      API_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-uploads:
